name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: Unit + end-to-end tests (scripted backend, no API key)
        run: pytest -q
      - name: Docker sandbox test
        if: matrix.python == '3.12'
        run: FLEET_DOCKER_TESTS=1 pytest -q tests/test_sandbox.py -k docker
      - name: Offline demo
        run: examples/demo.sh --sandbox subprocess
