name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # >= 22.18 runs the TypeScript bench case without a build step
      - name: Install bubblewrap (Linux jail for the subprocess sandbox)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Allow unprivileged user namespaces (Ubuntu 24.04's AppArmor default blocks bwrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pip install -e '.[dev]'
      - name: Report the subprocess sandbox isolation on this runner
        run: |
          python -c "from fleet.sandbox import Sandbox; print(Sandbox('.', mode='subprocess').isolation)" | tee isolation.txt
          grep -q '^bwrap:' isolation.txt
      - name: Unit + end-to-end tests (scripted backend, no API key)
        run: pytest -q
      - name: Docker sandbox test
        if: matrix.python == '3.12'
        run: FLEET_DOCKER_TESTS=1 pytest -q tests/test_sandbox.py -k docker
      - name: Offline demo
        run: examples/demo.sh --sandbox subprocess
      - name: Benchmark (scripted backend, Python + JavaScript + TypeScript cases)
        run: fleet bench --backend scripted --min-pass 1
      - name: Benchmark with a regression test written before each fix
        run: fleet bench --backend scripted --test-first --min-pass 1
