[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fleet"
version = "0.2.0"
description = "A fleet of autonomous coding agents: plan, edit, test, review, integrate, open a PR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fleet = "fleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet = ["bench/cases/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
